# workflow overview -> Checkout -> setup buildx -> setup qemu -> login to dockerhub -> build image -> scan image -> push image -> sign image
name: build and package gateway rate limiter
permissions:
    packages: write
    contents: read

on:
    push:
        branches:
        -   'main'
        -   'feature/**'
        paths:
        -   'core/**'
    pull_request:
        branches:
        -   'main'
    workflow_dispatch:

jobs:
    build:
        name: Build and push image to dockerhub 
        runs-on: ubuntu-latest
        env: 
            IMAGE_TAG: ${{ vars.DOCKER_USERNAME }}/gateway-rate-limiter:${{ github.run_number }}
        
        steps:
        -   name: Upload application code
            uses: actions/checkout@v6.0.3

        -   name: Set up QEMU for multi-platforms
            uses: docker/setup-qemu-action@v4.1.0

        -   name: Set up Docker Buildx for multi-stage build
            uses: docker/setup-buildx-action@v4.1.0

        -   name: Login to Docker Hub
            uses: docker/login-action@v4.2.0
            with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{secrets.DOCKERHUB_TOKEN }}

        -   name: Build Docker image
            uses: docker/build-push-action@v7.2.0
            with:
                context: .
                file: prod.Dockerfile
                platforms: linux/amd64, linux/arm64
                load: true
                tags: ${{ env.IMAGE_TAG }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

        -   name: Scan image with Trivy for vulnerability
            uses: aquasecurity/trivy-action@v0.36.0
            with: 
                image-ref: ${{ env.IMAGE_TAG }}
                format: table
                exit-code: 1
                severity: CRITICAL,HIGH

        -   name: Push image to Docker hub
            uses: docker/build-push-action@v7.2.0
            with:
                push: ${{ github.event_name != 'pull_request'}}
                tags: ${{ env.IMAGE_TAG }}
