name: Build and push container image to github and dockerhub

permissions:
    packages: write
    contents: read
    id-token: write

on:
    push:
        branches:
        -   'main'
        paths:
        -   'core/**'
        -   'prod.Dockerfile'
        -   'uv.lock'
    workflow_dispatch:

jobs:
    build:
        name: Build and push container image
        runs-on: ubuntu-latest
        env: 
            dockerfilePath: 'prod.Dockerfile'
            dockerImageName: '${{ vars.DOCKER_USERNAME }}/gateway-rate-limiter'
            githubImageName: 'ghcr.io/${{ github.repository }}'
        
        steps:
        -   name: Upload application code
            uses: actions/checkout@v6.0.3
            with:
                fetch-depth: 0

        -   name: Install GitVersion
            uses: gittools/actions/gitversion/setup@v4.5.0
            with:
                versionSpec: '6.0.0'

        -   name: Determine Version
            id: gitversion
            uses: gittools/actions/gitversion/execute@v4.5.0

        -   name: Set up Docker Buildx for multi-stage build
            uses: docker/setup-buildx-action@v4.1.0

        -   name: Login to GitHub
            uses: docker/login-action@v4.2.0
            with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

        -   name: Push image to Github Registry
            uses: docker/build-push-action@v7.2.0
            with:
                context: ${{ github.workspace }}
                file: ${{ env.dockerfilePath }}
                push: true
                tags: ${{ env.githubImageName }}:${{ steps.gitversion.outputs.semVer }}
                cache-from: type=gha
                cache-to: type=gha,mode=max 

        -   name: Set up QEMU for multi-platforms
            uses: docker/setup-qemu-action@v4.1.0
        -   name: Login to Docker Hub
            uses: docker/login-action@v4.2.0
            with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{secrets.DOCKERHUB_TOKEN }}

        -   name: Push image to Docker hub
            uses: docker/build-push-action@v7.2.0
            with:
                context: .
                file: ${{ env.dockerfilePath }}
                platforms: linux/amd64, linux/arm64
                push: true
                tags: ${{ env.dockerImageName }}:${{ steps.gitversion.outputs.semVer }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

        -   name: Install Cosign
            uses: sigstore/cosign-installer@v4.1.2

        -   name: Sign image
            run: cosign sign --yes ${{ env.dockerImageName }}:${{ steps.gitversion.outputs.semVer }}
