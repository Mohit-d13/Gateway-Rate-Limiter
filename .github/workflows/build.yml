name: build and package gateway rate limiter

on:
    push:
        paths:
        -   'core/**'
    workflow_dispatch:

jobs:
    build:
        name: Build and push image to dockerhub 
        runs-on: ubuntu-latest
        steps:
        -   name: Upload application code
            uses: actions/checkout@v6

        -   name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

        -   name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{secrets.DOCKERHUB_TOKEN }}

        -   name: Build and Push docker image
            uses: docker/build-push-action@v6
            with:
                context: .
                file: prod.Dockerfile
                push: true
                tags: ${{ vars.DOCKER_USERNAME }}/gateway-rate-limiter:${{ github.run_number }}
                cache-from: type=gha,scope=gateway-rate-limiter
                cache-to: type=gha,mode=max,scope=gateway-rate-limiter
