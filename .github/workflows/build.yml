name: build and package gateway rate limiter

permissions:
    packages: write
    contents: read
    id-token: write

on:
    push:
        branches:
        -   'main'
        -   'feature/**'
        paths:
        -   'core/**'
        -   'prod.Dockerfile'
        -   'uv.lock'
    pull_request:
        branches:
        -   'main'
    workflow_dispatch:

jobs:
    build:
        name: Build, scan and push image to dockerhub 
        runs-on: ubuntu-latest
        env: 
            DOC_FILE: prod.Dockerfile
            IMAGE_TAG: ${{ vars.DOCKER_USERNAME }}/gateway-rate-limiter:1.${{ github.run_number }}
        
        steps:
        -   name: Upload application code
            uses: actions/checkout@v6.0.3

        -   name: Set up QEMU for multi-platforms
            uses: docker/setup-qemu-action@v4.1.0

        -   name: Set up Docker Buildx for multi-stage build
            uses: docker/setup-buildx-action@v4.1.0

        -   name: Login to Docker Hub
            uses: docker/login-action@v4.2.0
            with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{secrets.DOCKERHUB_TOKEN }}

        -   name: Build Docker image
            uses: docker/build-push-action@v7.2.0
            with:
                context: .
                file: ${{ env.DOC_FILE }}
                load: true
                tags: ${{ env.IMAGE_TAG }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

        -   name: Scan image with Trivy for vulnerability
            uses: aquasecurity/trivy-action@v0.36.0
            with: 
                image-ref: ${{ env.IMAGE_TAG }}
                format: table
                exit-code: 1
                severity: CRITICAL,HIGH
                ignore-unfixed: true

        -   name: Push image to Docker hub
            if: github.event_name != 'pull_request'
            uses: docker/build-push-action@v7.2.0
            with:
                context: .
                file: ${{ env.DOC_FILE }}
                platforms: linux/amd64, linux/arm64
                push: true
                tags: ${{ env.IMAGE_TAG }}
                cache-from: type=gha

        -   name: Install Cosign
            if: github.event_name != 'pull_request'
            uses: sigstore/cosign-installer@v4.1.2

        -   name: Sign image
            if: github.event_name != 'pull_request'
            run: cosign sign --yes ${{ env.IMAGE_TAG }}
