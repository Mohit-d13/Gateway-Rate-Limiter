name: Compile and test new features integration

on:
    workflow_dispatch:
    push:
        branches:
        -   'feature/**'
        paths:
        -   'core/**'
        -   'uv.lock'

jobs:
    compile:
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout source code
            uses: actions/checkout@v6.0.3

        -   name: Setup python with uv
            uses: astral-sh/setup-uv@v8.2.0
            with:
                version: "0.5.x"
                python-version: "3.12"
                enable-cache: true
                cache-dependency-glob: "**/uv.lock" 
            
        -   name: Install project dependencies
            run: uv sync --locked --no-dev

        -   name: Check import resolve
            run: uv run python -c "import core.main"
