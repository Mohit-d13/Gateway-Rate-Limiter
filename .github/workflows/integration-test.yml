name: Test new features integration
permissions:
    contents: read

on:
    workflow_dispatch:
    push:
        branches:
        -   'main'
        -   'feature/**'
        paths:
        -   'core/**'
        -   'tests/**'
        -   'uv.lock'
    pull_request:
        branches:
        -   'main'
        paths:
        -   'core/**'
        -   'tests/**'
        -   'uv.lock' 

jobs:
    quality_tests:
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout source code
            uses: actions/checkout@v6.0.3

        -   name: Setup python with uv
            uses: astral-sh/setup-uv@v8.2.0
            with:
                version: "0.5.x"
                python-version: "3.12"
                enable-cache: true
                cache-dependency-glob: "**/uv.lock" 
            
        -   name: Install project dependencies
            run: uv sync --frozen

        -   name: Check import resolve
            run: uv run python -c "import core.main"

        -   name: Run linter and fix safe issues
            run: uv run ruff check .

        -   name: Run unit tests and display report
            if: always()
            env:
                pytest_github_report: true
                pytest_report_title: "Test Report Summary"
                pytest_use_zeros: true
                pytest_verbosity: 1
            run: uv run pytest tests/
