name: Publish Image to GitHub GHCR and DockerHub

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: gateway-rate-limiter

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout the tagged commit
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      # Enables arm64 builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      # Enables Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      # Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4.4.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Install Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Generate tags and OCI labels
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            docker.io/${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}

          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest
            type=sha

      # Build once and push everywhere
      - name: Build and Push
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./prod.Dockerfile

          push: true

          platforms: |
            linux/amd64,
            linux/arm64

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: true
          sbom: true

      # Sign every published image
      - name: Sign Images
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "${TAGS}" | while read image
          do
            cosign sign --yes "${image}@${DIGEST}"
          done

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy Application
        uses: ./github/workflows/deploy-to-eks.yml
        with:
          image_tag: ${{ github.event.release.tag_name }}