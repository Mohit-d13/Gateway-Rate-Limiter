name: Build, package and push container images

permissions:
    actions: write
    packages: write
    contents: read
    id-token: write

on:
    workflow_call:
        inputs:
            registry:
                required: true
                type: string
                default: 'ghcr.io'
            containerRegistry:
                required: true
                type: string
            dockerfilePath:
                required: true
                type: string
                default: 'prod.Dockerfile'
            namespace:
                required: true
                type: string
                default: 'gateway'

        secrets:
            registryUsername:
                required: true
            registryPassword:
                required: true
    workflow_dispatch:
        inputs:
            registry:
                required: true
                type: string
                default: 'ghcr.io'
            containerRegistry:
                required: true
                type: string
            dockerfilePath:
                required: true
                type: string
                default: 'prod.Dockerfile'
            namespace:
                required: true
                type: string
                default: 'gateway'

jobs:
    build:
        name: Build and push container image
        runs-on: ubuntu-latest
        
        steps:
        -   name: Upload application code
            uses: actions/checkout@v6.0.3
            with:
                fetch-depth: 0

        -   name: Install GitVersion
            uses: gittools/actions/gitversion/setup@v4.5.0

        -   name: Determine Version
            id: gitversion
            uses: gittools/actions/gitversion/execute@v4.5.0

        -   name: Set up QEMU for multi-platforms
            uses: docker/setup-qemu-action@v4.1.0

        -   name: Set up Docker Buildx for multi-stage build
            uses: docker/setup-buildx-action@v4.1.0

        -   name: Login to container registry
            uses: docker/login-action@v4.2.0
            with:
                registry: ${{ inputs.registry }}
                username: ${{ secrets.registryUsername }}
                password: ${{ secrets.registryPassword }}

        -   name: Push image to Github Registry
            uses: docker/build-push-action@v7.2.0
            with:
                context: ${{ github.workspace }}
                file: ${{ inputs.dockerfilePath }}
                platforms: linux/amd64, linux/arm64
                push: true
                tags: ${{ inputs.containerRegistry }}:${{ steps.gitversion.outputs.semVer }}
                cache-from: type=gha
                cache-to: type=gha,mode=max 

        -   name: Install Cosign
            uses: sigstore/cosign-installer@v4.1.2

        -   name: Sign image
            run: cosign sign --yes ${{ inputs.containerRegistry }}:${{ steps.gitversion.outputs.semVer }}