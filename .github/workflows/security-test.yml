name: Analyze code security by Testing

on:
    pull_request:
        branches:
        -   'main'
        paths:
        -   'core/**'
        -   'uv.lock'
        -   'prod.Dockerfile'
    workflow_dispatch:

jobs:
    analyzecode:
        name: Analyze
        runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
        timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
        
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language:
                -   python
                -   actions

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v7.0.0

        -   name: Setup python with uv
            uses: astral-sh/setup-uv@v8.2.0
            with:
                version: "0.5.x"
                python-version: "3.12"
                enable-cache: true
                cache-dependency-glob: "**/uv.lock" 
            
        -   name: Install project dependencies
            run: uv sync --frozen

        -   name: Initialize CodeQL
            uses: github/codeql-action/init@v4
            with:
                languages: ${{ matrix.language }}


        -   name: Link Virtual Environment to CodeQL
            run: |
                echo "CODEQL_PYTHON=$(which python)" >> $GITHUB_ENV

        -   name: Perform CodeQL Analysis
            uses: github/codeql-action/analyze@v4
            with:
                category: "/language:${{ matrix.language }}"

    analyzecontainer:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
            packages: read

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v7.0.0

        -   name: Set up Docker Buildx for image creation
            uses: docker/setup-buildx-action@v4.1.0

        -   name: Build image for scanning
            uses: docker/build-push-action@v7.2.0
            with:
                context: .
                file: prod.Dockerfile
                load: true
                tags: scan-target:pr-${{ github.event.pull_request.number }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

        -   name: Run Trivy vulnerability scanner
            uses: aquasecurity/trivy-action@v0.36.0
            with:
                image-ref: scan-target:pr-${{ github.event.pull_request.number }}
                exit-code: '1'
                severity: 'HIGH,CRITICAL'             # Fail the scan if severity is HIGH or CRITICAL
                format: 'sarif'
                output: 'trivy-results.sarif'

        -   name: Upload Trivy scan results to Github Security tab
            uses: github/codeql-action/upload-sarif@v4
            with:
                sarif_file: 'trivy-results.sarif'
