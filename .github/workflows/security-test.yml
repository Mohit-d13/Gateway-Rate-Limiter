name: Analyze code security by Testing

env:
    containerRegistry: 'ghcr.io/${{ github.repository }}'
    dockerfilePath: 'prod.Dockerfile'

on:
    pull_request:
        branches:
        -   'main'
        paths:
        -   'core/**'
        -   'uv.lock'
        -   'prod.Dockerfile'
    workflow_dispatch:

jobs:
    analyzecode:
        name: Analyze
        runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
        timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
        
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language:
                -   python
                -   actions

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v6.0.3

        -   name: Setup python with uv
            uses: astral-sh/setup-uv@v8.2.0
            with:
                version: "0.5.x"
                python-version: "3.12"
                enable-cache: true
                cache-dependency-glob: "**/uv.lock" 
            
        -   name: Install project dependencies
            run: uv sync --frozen

        -   name: Initialize CodeQL
            uses: github/codeql-action/init@v4
            with:
                languages: ${{ matrix.language }}


        -   name: Link Virtual Environment to CodeQL
            run: |
                echo "CODEQL_PYTHON=${which python}" >> $GITHUB_ENV

        -   name: Perform CodeQL Analysis
            uses: github/codeql-action/analyze@v4
            with:
                category: "/language:${{ matrix.language }}"

    analyzecontainer:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
            packages: read

        steps:
        -   name: Checkout repository
            uses: actions/checkout@v6.0.3
            with:
                fetch-depth: 0

        -   name: Install GitVersion
            uses: gittools/actions/gitversion/setup@v4.5.0
            with:
                versionSpec: '6.0.0'

        -   name: Determine Version
            id: gitversion
            uses: gittools/actions/gitversion/execute@v4.5.0

        -   name: Run Trivy vulnerability scanner
            uses: aquasecurity/trivy-action@v0.36.0
            with:
                image-ref: ${{ env.containerRegistry }}:${{ steps.gitversion.outputs.semVer }}
                format: 'sarif'
                output: 'trivy-results.sarif'
            env:
                TRIVY_USERNAME: ${{ github.actor }}
                TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

        -   name: Upload Trivy scan results to Github Security tab
            uses: github/codeql-action/upload-sarif@v4
            with:
                sarif_file: 'trivy-results.sarif'
