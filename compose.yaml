services:
  redis:
    image: redis:7.2-alpine
    container_name: rl-redis
    restart: always
    secrets:
      - redis-password
    ports:
    - '6379:6379'
    volumes:
    - redis-data:/data
    environment:
      PASSWORD_FILE_PATH: /run/secrets/redis-password
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: dev.Dockerfile
    container_name: rate-limiter
    ports:
    - '8000:8000'
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      PASSWORD_FILE_PATH: /run/secrets/redis-password
    develop:
      watch:
      - action: rebuild
        path: .
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - redis-password

volumes:
  redis-data:
secrets:
  redis-password:
    file: ./secrets/redis-creds/password