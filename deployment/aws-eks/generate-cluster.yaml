apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: rate-limiter-cluster
  region: ap-south-1
  version: "1.36"

iam:
  withOIDC: true

addons:
- name: aws-ebs-csi-driver

managedNodeGroups:
- name: ng-workers
  instanceType: t3.small
  desiredCapacity: 2
  minSize: 1
  maxSize: 3
  volumeSize: 20
  labels: {role: worker}
  